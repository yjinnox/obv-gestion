services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: obv_gestion
      POSTGRES_USER: obv
      POSTGRES_PASSWORD: obv
    ports:
      - "5432:5432"
    volumes:
      - obv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obv -d obv_gestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: obv_gestion
      DB_USER: obv
      DB_PASSWORD: obv
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      APP_FRONTEND_URL: http://localhost:4200
      JWT_SECRET: dev-only-secret-never-used-in-production-please-change-me
      NOTIFICATION_MODE: real
      SMS_PROVIDER: log
      BOOTSTRAP_ADMIN_NOM: Admin
      BOOTSTRAP_ADMIN_PRENOMS: OBV
      BOOTSTRAP_ADMIN_CANAL: EMAIL
      BOOTSTRAP_ADMIN_EMAIL: yjinnox@gmail.com
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

volumes:
  obv-postgres-data:
