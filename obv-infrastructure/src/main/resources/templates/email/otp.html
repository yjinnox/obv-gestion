<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Votre code de vérification OBV Gestion</title>
</head>
<body style="margin:0; padding:0; background-color:#EFEFEF; font-family: Arial, sans-serif; color:#1B1B1B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EFEFEF; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#FFFFFF; border-radius:4px; overflow:hidden;">
                <tr>
                    <td style="background-color:#096A09; padding:16px 24px;">
                        <span style="color:#FFFFFF; font-size:18px; font-weight:bold;">OBV Gestion</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <p>Bonjour <span th:text="${nom}">Nom</span>,</p>
                        <p>Voici votre code de vérification, valable 10 minutes :</p>
                        <p style="text-align:center; margin:32px 0; font-size:32px; font-weight:bold; letter-spacing:8px; color:#096A09;"
                           th:text="${code}">000000</p>
                        <p style="font-size:13px; color:#5a6056;">Ne communiquez ce code à personne.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
