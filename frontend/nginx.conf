server {
    # Port non privilégié : permet de faire tourner nginx sans root et
    # sans capacité CAP_NET_BIND_SERVICE (§16.2, durcissement Kubernetes).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Repli SPA : toute route inconnue retombe sur index.html (routage Angular côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
