databaseChangeLog:
  - changeSet:
      id: 0026-ligne-vente
      author: obv-gestion
      comment: "§8.2 — lignes d'une vente (produit, quantité en demi-casiers, prix et consigne figés)."
      changes:
        - createTable:
            tableName: ligne_vente
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: vente_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ligne_vente_vente, references: "vente(id)"}}
              - column: {name: produit_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ligne_vente_produit, references: "produit(id)"}}
              - column: {name: quantite_demi_casiers, type: BIGINT, constraints: {nullable: false}}
              - column: {name: prix_vente_casier_xof, type: BIGINT, constraints: {nullable: false}}
              - column: {name: montant_consigne_casier_xof, type: BIGINT, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: ligne_vente
            indexName: ix_ligne_vente_vente
            columns:
              - column: {name: vente_id}
