databaseChangeLog:
  - changeSet:
      id: 0007-journal-action
      author: obv-gestion
      comment: "§12 — journal append-only des actions sensibles."
      changes:
        - createTable:
            tableName: journal_action
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: acteur, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: action, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: cible_type, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: cible_id, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: valeurs_avant, type: TEXT}
              - column: {name: valeurs_apres, type: TEXT}
              - column: {name: adresse_ip, type: VARCHAR(45)}
              - column: {name: horodatage, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
