databaseChangeLog:
  - changeSet:
      id: 0031-envers-p5
      author: obv-gestion
      comment: >
        §12 — Hibernate Envers étendu à BonTransfert et LigneTransfert.
        revinfo/revinfo_seq existent déjà (0008-envers-audit).
      changes:
        - createTable:
            tableName: bon_transfert_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_bon_transfert_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: numero, type: VARCHAR(50)}
              - column: {name: point_de_vente_source_id, type: BIGINT}
              - column: {name: point_de_vente_destination_id, type: BIGINT}
              - column: {name: date_heure, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: statut, type: VARCHAR(25)}
              - column: {name: motif_annulation, type: VARCHAR(500)}
              - column: {name: cloturee_par, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createTable:
            tableName: ligne_transfert_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_ligne_transfert_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: transfert_id, type: BIGINT}
              - column: {name: produit_id, type: BIGINT}
              - column: {name: conditionnement_id, type: BIGINT}
              - column: {name: quantite_demi_casiers, type: BIGINT}
              - column: {name: quantite_bouteilles, type: BIGINT}
              - column: {name: prix_cession_casier_xof, type: BIGINT}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
