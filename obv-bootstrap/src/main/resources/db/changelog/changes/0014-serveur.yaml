databaseChangeLog:
  - changeSet:
      id: 0014-serveur
      author: obv-gestion
      comment: "§5.1 — serveurs d'un bar/maquis (référentiel, pas de compte applicatif en v1)."
      changes:
        - createTable:
            tableName: serveur
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: point_de_vente_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_serveur_point_de_vente, references: "point_de_vente(id)"}}
              - column: {name: nom, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: prenoms, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: telephone, type: VARCHAR(20)}
              - column: {name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
