databaseChangeLog:
  - changeSet:
      id: 0022-envers-p3
      author: obv-gestion
      comment: >
        §12 — Hibernate Envers étendu à Tarif (rattrapage P2 : @Audited
        oublié), Stock, Reception et LigneReception. revinfo/revinfo_seq
        existent déjà (0008-envers-audit).
      changes:
        - createTable:
            tableName: tarif_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_tarif_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: point_de_vente_id, type: BIGINT}
              - column: {name: produit_id, type: BIGINT}
              - column: {name: unite_vente, type: VARCHAR(20)}
              - column: {name: nature, type: VARCHAR(10)}
              - column: {name: montant_xof, type: BIGINT}
              - column: {name: date_debut, type: DATE}
              - column: {name: date_fin, type: DATE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createTable:
            tableName: stock_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_stock_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: point_de_vente_id, type: BIGINT}
              - column: {name: produit_id, type: BIGINT}
              - column: {name: quantite, type: BIGINT}
              - column: {name: version, type: BIGINT}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createTable:
            tableName: reception_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_reception_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: fournisseur_id, type: BIGINT}
              - column: {name: point_de_vente_id, type: BIGINT}
              - column: {name: date_heure_livraison, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: statut, type: VARCHAR(25)}
              - column: {name: motif_annulation, type: VARCHAR(500)}
              - column: {name: cloturee_par, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createTable:
            tableName: ligne_reception_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_ligne_reception_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: reception_id, type: BIGINT}
              - column: {name: produit_id, type: BIGINT}
              - column: {name: conditionnement_id, type: BIGINT}
              - column: {name: nombre_casiers, type: BIGINT}
              - column: {name: prix_achat_casier_xof, type: BIGINT}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
