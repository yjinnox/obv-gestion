databaseChangeLog:
  - changeSet:
      id: 0016-tarif
      author: obv-gestion
      comment: "§5.2 — tarification datée (RG-08/RG-09/RG-10)."
      changes:
        - createTable:
            tableName: tarif
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: point_de_vente_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_tarif_point_de_vente, references: "point_de_vente(id)"}}
              - column: {name: produit_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_tarif_produit, references: "produit(id)"}}
              - column: {name: unite_vente, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: nature, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: montant_xof, type: BIGINT, constraints: {nullable: false}}
              - column: {name: date_debut, type: DATE, constraints: {nullable: false}}
              - column: {name: date_fin, type: DATE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: tarif
            indexName: ix_tarif_recherche
            columns:
              - column: {name: point_de_vente_id}
              - column: {name: produit_id}
              - column: {name: nature}
        - sql:
            comment: "RG-08 — au plus un tarif ouvert (date_fin NULL) par (point de vente, produit, unité, nature)."
            sql: >
              CREATE UNIQUE INDEX uk_tarif_ouvert
              ON tarif (point_de_vente_id, produit_id, unite_vente, nature)
              WHERE date_fin IS NULL
