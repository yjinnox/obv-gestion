databaseChangeLog:
  - changeSet:
      id: 0011-produit
      author: obv-gestion
      comment: "§5.1 — produit = couple marque + volume, unicité (marque, volume)."
      changes:
        - createTable:
            tableName: produit
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: marque_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_produit_marque, references: "marque(id)"}}
              - column: {name: volume_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_produit_volume, references: "volume(id)"}}
              - column: {name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - addUniqueConstraint:
            tableName: produit
            columnNames: marque_id, volume_id
            constraintName: uk_produit_marque_volume
