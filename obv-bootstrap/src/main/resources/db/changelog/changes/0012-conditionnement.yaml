databaseChangeLog:
  - changeSet:
      id: 0012-conditionnement
      author: obv-gestion
      comment: "§5.1 — casier d'un produit ; demi-casier autorisé calculé (capacité paire), non persisté."
      changes:
        - createTable:
            tableName: conditionnement
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: produit_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_conditionnement_produit, references: "produit(id)"}}
              - column: {name: capacite_bouteilles, type: INT, constraints: {nullable: false}}
              - column: {name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
