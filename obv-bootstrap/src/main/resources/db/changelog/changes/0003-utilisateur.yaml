databaseChangeLog:
  - changeSet:
      id: 0003-utilisateur
      author: obv-gestion
      comment: "§4 — comptes utilisateurs."
      changes:
        - createTable:
            tableName: utilisateur
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: nom, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: prenoms, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: canal_contact, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: email, type: VARCHAR(255)}
              - column: {name: telephone, type: VARCHAR(20)}
              - column: {name: statut, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: mot_de_passe_hash, type: VARCHAR(255)}
              - column: {name: date_archivage, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - addUniqueConstraint:
            tableName: utilisateur
            columnNames: email
            constraintName: uk_utilisateur_email
        - addUniqueConstraint:
            tableName: utilisateur
            columnNames: telephone
            constraintName: uk_utilisateur_telephone
