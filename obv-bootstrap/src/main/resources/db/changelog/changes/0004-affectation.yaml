databaseChangeLog:
  - changeSet:
      id: 0004-affectation
      author: obv-gestion
      comment: "§3, H10 — rattachement rôle / point de vente d'un utilisateur."
      changes:
        - createTable:
            tableName: affectation
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: utilisateur_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_affectation_utilisateur, references: "utilisateur(id)"}}
              - column: {name: role, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: point_de_vente_id, type: BIGINT, constraints: {foreignKeyName: fk_affectation_point_de_vente, references: "point_de_vente(id)"}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: affectation
            indexName: ix_affectation_utilisateur
            columns:
              - column: {name: utilisateur_id}
