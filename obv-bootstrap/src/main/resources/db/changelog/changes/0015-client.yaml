databaseChangeLog:
  - changeSet:
      id: 0015-client
      author: obv-gestion
      comment: "§5.1 — clients du dépôt (RG-07 : champs conditionnés par le type)."
      changes:
        - createTable:
            tableName: client
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: type, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: nom, type: VARCHAR(255)}
              - column: {name: prenoms, type: VARCHAR(255)}
              - column: {name: raison_sociale, type: VARCHAR(255)}
              - column: {name: telephone, type: VARCHAR(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_client_telephone}}
              - column: {name: email, type: VARCHAR(255)}
              - column: {name: adresse_facturation, type: VARCHAR(255)}
              - column: {name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
