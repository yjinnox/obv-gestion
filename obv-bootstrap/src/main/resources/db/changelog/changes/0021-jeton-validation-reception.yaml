databaseChangeLog:
  - changeSet:
      id: 0021-jeton-validation-reception
      author: obv-gestion
      comment: "§7.2 étapes 4-5, RG-35/RG-36 — jeton de demande de validation d'une réception."
      changes:
        - createTable:
            tableName: jeton_validation_reception
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: reception_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jeton_validation_reception_reception, references: "reception(id)"}}
              - column: {name: destinataire_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jeton_validation_reception_destinataire, references: "utilisateur(id)"}}
              - column: {name: token_hash, type: VARCHAR(255), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_jeton_validation_reception_token_hash}}
              - column: {name: date_expiration, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: date_utilisation, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
