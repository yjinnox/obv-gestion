databaseChangeLog:
  - changeSet:
      id: 0029-bon-transfert
      author: obv-gestion
      comment: "§9 — transfert de marchandise dépôt → bar (RG-30 à RG-32)."
      changes:
        - createTable:
            tableName: bon_transfert
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: numero, type: VARCHAR(50), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_bon_transfert_numero}}
              - column: {name: point_de_vente_source_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_bon_transfert_source, references: "point_de_vente(id)"}}
              - column: {name: point_de_vente_destination_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_bon_transfert_destination, references: "point_de_vente(id)"}}
              - column: {name: date_heure, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: statut, type: VARCHAR(25), constraints: {nullable: false}}
              - column: {name: motif_annulation, type: VARCHAR(500)}
              - column: {name: cloturee_par, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: bon_transfert
            indexName: ix_bon_transfert_recherche
            columns:
              - column: {name: point_de_vente_source_id}
              - column: {name: point_de_vente_destination_id}
              - column: {name: statut}
