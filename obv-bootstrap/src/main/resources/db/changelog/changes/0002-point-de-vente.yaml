databaseChangeLog:
  - changeSet:
      id: 0002-point-de-vente
      author: obv-gestion
      comment: "§5.1 — référentiel des points de vente (amorcé en P1 pour le rattachement des utilisateurs, H10)."
      changes:
        - createTable:
            tableName: point_de_vente
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: libelle, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: type, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: adresse, type: VARCHAR(255)}
              - column: {name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
