databaseChangeLog:
  - changeSet:
      id: 0020-ligne-reception
      author: obv-gestion
      comment: "§7.2 étape 2 — lignes d'une réception (produit, conditionnement, casiers, prix figé)."
      changes:
        - createTable:
            tableName: ligne_reception
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: reception_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ligne_reception_reception, references: "reception(id)"}}
              - column: {name: produit_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ligne_reception_produit, references: "produit(id)"}}
              - column: {name: conditionnement_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ligne_reception_conditionnement, references: "conditionnement(id)"}}
              - column: {name: nombre_casiers, type: BIGINT, constraints: {nullable: false}}
              - column: {name: prix_achat_casier_xof, type: BIGINT, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: ligne_reception
            indexName: ix_ligne_reception_reception
            columns:
              - column: {name: reception_id}
