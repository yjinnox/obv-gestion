databaseChangeLog:
  - changeSet:
      id: 0034-envers-p6
      author: obv-gestion
      comment: >
        §12 — Hibernate Envers étendu à TicketServeur et LigneTicketServeur.
        revinfo/revinfo_seq existent déjà (0008-envers-audit).
      changes:
        - createTable:
            tableName: ticket_serveur_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_ticket_serveur_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: session_vente_id, type: BIGINT}
              - column: {name: serveur_id, type: BIGINT}
              - column: {name: statut, type: VARCHAR(20)}
              - column: {name: mode_paiement, type: VARCHAR(20)}
              - column: {name: montant_total_xof, type: BIGINT}
              - column: {name: date_encaissement, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: encaissee_par, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createTable:
            tableName: ligne_ticket_serveur_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_ligne_ticket_serveur_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: ticket_serveur_id, type: BIGINT}
              - column: {name: produit_id, type: BIGINT}
              - column: {name: quantite_bouteilles, type: BIGINT}
              - column: {name: prix_vente_bouteille_xof, type: BIGINT}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
