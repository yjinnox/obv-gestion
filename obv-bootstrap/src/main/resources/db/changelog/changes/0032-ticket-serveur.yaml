databaseChangeLog:
  - changeSet:
      id: 0032-ticket-serveur
      author: obv-gestion
      comment: "§10 — vente au bar par ticket serveur (RG-33, RG-34)."
      changes:
        - createTable:
            tableName: ticket_serveur
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: session_vente_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ticket_serveur_session_vente, references: "session_vente(id)"}}
              - column: {name: serveur_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_ticket_serveur_serveur, references: "serveur(id)"}}
              - column: {name: statut, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: mode_paiement, type: VARCHAR(20)}
              - column: {name: montant_total_xof, type: BIGINT, constraints: {nullable: false}}
              - column: {name: date_encaissement, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: encaissee_par, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: ticket_serveur
            indexName: ix_ticket_serveur_recherche
            columns:
              - column: {name: session_vente_id}
              - column: {name: serveur_id}
              - column: {name: statut}
