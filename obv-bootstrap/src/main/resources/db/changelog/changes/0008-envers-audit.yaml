databaseChangeLog:
  - changeSet:
      id: 0008-envers-audit
      author: obv-gestion
      comment: "§12 — Hibernate Envers activé sur Utilisateur."
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            incrementBy: 50
            startValue: 1
        - createTable:
            tableName: revinfo
            columns:
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: revtstmp, type: BIGINT}
        - createTable:
            tableName: utilisateur_aud
            columns:
              - column: {name: id, type: BIGINT, constraints: {primaryKey: true, nullable: false}}
              - column: {name: rev, type: INT, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_utilisateur_aud_revinfo, references: "revinfo(rev)"}}
              - column: {name: revtype, type: SMALLINT}
              - column: {name: nom, type: VARCHAR(255)}
              - column: {name: prenoms, type: VARCHAR(255)}
              - column: {name: canal_contact, type: VARCHAR(20)}
              - column: {name: email, type: VARCHAR(255)}
              - column: {name: telephone, type: VARCHAR(20)}
              - column: {name: statut, type: VARCHAR(30)}
              - column: {name: mot_de_passe_hash, type: VARCHAR(255)}
              - column: {name: date_archivage, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: updated_by, type: VARCHAR(255)}
