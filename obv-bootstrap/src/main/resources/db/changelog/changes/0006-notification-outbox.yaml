databaseChangeLog:
  - changeSet:
      id: 0006-notification-outbox
      author: obv-gestion
      comment: "§11 — file transactionnelle des notifications (pattern outbox)."
      changes:
        - createTable:
            tableName: notification_outbox
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: canal, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: destinataire, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: gabarit, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: variables_json, type: TEXT, constraints: {nullable: false}}
              - column: {name: statut, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: tentatives, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: derniere_erreur, type: VARCHAR(1000)}
              - column: {name: date_envoi, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: created_by, type: VARCHAR(255)}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_by, type: VARCHAR(255)}
        - createIndex:
            tableName: notification_outbox
            indexName: ix_notification_outbox_statut_created_at
            columns:
              - column: {name: statut}
              - column: {name: created_at}
