# Changelog racine Liquibase. Un fichier par version, inclus ici dans l'ordre.
# Aucune règle de gestion ne doit être inventée : les changesets sont ajoutés
# phase par phase, au fur et à mesure que le référentiel (§5) et les entités
# métier sont introduits (P1+).
databaseChangeLog:
  - include:
      file: db/changelog/changes/0001-init.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0002-point-de-vente.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0003-utilisateur.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0004-affectation.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0005-jeton-activation.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0006-notification-outbox.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0007-journal-action.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/0008-envers-audit.yaml
      relativeToChangelogFile: false
