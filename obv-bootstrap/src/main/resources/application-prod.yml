spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.obvgestion: INFO

management:
  endpoint:
    health:
      show-details: never

# §16.2 (durcissement) — la documentation OpenAPI/Swagger ne doit pas être
# exposée publiquement en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
