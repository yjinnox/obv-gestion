spring:
  application:
    name: obv-gestion
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: 8080
  # §16.2 (durcissement) — derrière un reverse proxy de confiance (nginx en
  # dev, Ingress en k8s) : getRemoteAddr()/X-Forwarded-* sont résolus par le
  # framework, pour une adresse IP fiable dans l'audit (§12) et le
  # rate limiting, plutôt qu'un parsing manuel non fiable des en-têtes.
  forward-headers-strategy: framework

# §16.2 (durcissement) — l'observabilité (Actuator, Prometheus) vit sur un
# port distinct de l'API publique : ce port n'est jamais exposé par
# l'Ingress, seulement atteignable depuis l'intérieur du cluster
# (kubelet pour les probes, Prometheus pour le scraping). Spring Boot
# héberge alors Actuator dans un contexte Web séparé, hors de la chaîne
# de filtres Spring Security de l'API — l'isolation réseau tient lieu
# d'authentification pour ce plan opérationnel.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  timezone: Africa/Abidjan
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  # §16.2 (durcissement) — liste (séparée par des virgules) des origines
  # CORS autorisées ; jamais de joker (voir SecurityConfig).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

# §20.5 — mentions fiscales de la facture (n° contribuable, TVA).
entreprise:
  raison-sociale: ${ENTREPRISE_RAISON_SOCIALE:OBV Gestion}
  adresse: ${ENTREPRISE_ADRESSE:}
  numero-contribuable: ${ENTREPRISE_NUMERO_CONTRIBUABLE:}
  taux-tva-pourcent: ${ENTREPRISE_TAUX_TVA_POURCENT:18}

security:
  jwt:
    secret: ${JWT_SECRET}

notification:
  mode: ${NOTIFICATION_MODE:real}
  email:
    expediteur: ${NOTIFICATION_EMAIL_FROM:no-reply@obv-gestion.local}
  outbox:
    intervalle-ms: 15000

sms:
  provider: ${SMS_PROVIDER:log}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM_NUMBER:}
  orange:
    client-id: ${ORANGE_CLIENT_ID:}
    client-secret: ${ORANGE_CLIENT_SECRET:}
    sender-address: ${ORANGE_SENDER_ADDRESS:}

bootstrap:
  super-admin:
    nom: ${BOOTSTRAP_ADMIN_NOM:}
    prenoms: ${BOOTSTRAP_ADMIN_PRENOMS:}
    canal-contact: ${BOOTSTRAP_ADMIN_CANAL:EMAIL}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    telephone: ${BOOTSTRAP_ADMIN_TELEPHONE:}
