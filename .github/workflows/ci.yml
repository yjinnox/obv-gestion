name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (build, tests, SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test and analyse
        run: mvn -B verify

      - name: Publish surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore

  frontend:
    name: Frontend (build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test

  e2e:
    name: E2E (Playwright — parcours vente dépôt)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: obv_gestion
          POSTGRES_USER: obv
          POSTGRES_PASSWORD: obv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obv -d obv_gestion"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build backend jar
        run: mvn -B -pl obv-bootstrap -am package -DskipTests

      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: obv_gestion
          DB_USER: obv
          DB_PASSWORD: obv
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-only-secret-never-used-in-production-please-change-me
          BOOTSTRAP_ADMIN_NOM: Admin
          BOOTSTRAP_ADMIN_PRENOMS: OBV
          BOOTSTRAP_ADMIN_CANAL: EMAIL
          BOOTSTRAP_ADMIN_EMAIL: admin@obv-gestion.local
        run: |
          nohup java -jar obv-bootstrap/target/obv-gestion.jar > backend-e2e.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8081/actuator/health/readiness > /dev/null; then
              echo "Backend prêt."
              exit 0
            fi
            sleep 3
          done
          echo "Le backend n'a pas démarré à temps." >&2
          cat backend-e2e.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_DB_HOST: localhost
          E2E_DB_PORT: "5432"
          E2E_DB_NAME: obv_gestion
          E2E_DB_USER: obv
          E2E_DB_PASSWORD: obv
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-e2e
          path: backend-e2e.log
          if-no-files-found: ignore

  helm-chart:
    name: Helm chart (lint, template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.4"

      - name: Lint chart
        run: helm lint k8s/obv-gestion

      - name: Render chart (default values)
        run: helm template obv-gestion k8s/obv-gestion

      - name: Render chart (TLS/autoscaling disabled, existing secret)
        run: |
          helm template obv-gestion k8s/obv-gestion \
            --set ingress.tls.enabled=false \
            --set backend.autoscaling.enabled=false \
            --set backend.podDisruptionBudget.enabled=false \
            --set secrets.create=false \
            --set secrets.existingSecretName=obv-gestion-external-secrets

  docker-images:
    name: Build container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
