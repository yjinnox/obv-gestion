{{- if .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "obv-gestion.fullname" . }}-backend
  labels:
    {{- include "obv-gestion.backend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "obv-gestion.backend.selectorLabels" . | nindent 6 }}
{{- end }}
