apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obv-gestion.fullname" . }}-backend
  labels:
    {{- include "obv-gestion.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "obv-gestion.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obv-gestion.backend.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.backend.managementPort }}
              protocol: TCP
          env:
            # readOnlyRootFilesystem (durcissement, §16.2) : le moteur PDF
            # (openhtmltopdf/PDFBox, §8.2) construit un cache de polices
            # sous le répertoire personnel du processus — le forcer vers le
            # volume inscriptible /tmp plutôt que de dépendre d'un chemin
            # non garanti sur une racine en lecture seule.
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "obv-gestion.fullname" . }}-config
            - secretRef:
                name: {{ include "obv-gestion.secretName" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: management
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: management
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.backend.writableVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.backend.writableVolumes }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
