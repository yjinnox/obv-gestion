apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.serviceName }}
  labels:
    {{- include "obv-gestion.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "obv-gestion.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
